[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meo-automation"
version = "0.1.0"
description = "Fully-automated Google Business Profile (MEO) tool for THE BODY / MYBEAR STUDIO"
requires-python = ">=3.11"
dependencies = [
    "cffi>=1.15.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.120.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "anthropic>=0.25.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
# To use OpenAI instead of Anthropic: pip install "meo-automation[openai]"
# Then set llm.provider = "openai" in config/content.yaml.
openai = ["openai>=1.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
]

[project.scripts]
meo-run = "meo.main:main"
meo-status = "meo.tools.status:main"
meo-preview = "meo.tools.preview:main"
meo-validate = "meo.tools.validate:main"
meo-report = "meo.tools.report:main"
meo-health = "meo.tools.health:main"
meo-export = "meo.tools.export:main"
meo-reset = "meo.tools.reset:main"
meo-discover-locations = "meo.tools.discover_locations:main"
meo-stats = "meo.tools.stats:main"
meo-weekly-digest = "meo.tools.weekly_digest:main"
meo-photo-audit = "meo.tools.photo_audit:main"
meo-review-alert = "meo.tools.review_alert:main"
meo-monthly-digest = "meo.tools.monthly_digest:main"
meo-trend = "meo.tools.trend:main"
meo-config-show = "meo.tools.config_show:main"
meo-held-reply-draft = "meo.tools.held_reply_draft:main"
meo-calendar = "meo.tools.calendar:main"
meo-score = "meo.tools.score:main"
meo-score-history = "meo.tools.score_history:main"
meo-next = "meo.tools.next:main"
meo-dismiss = "meo.tools.dismiss:main"
meo-error-alert = "meo.tools.error_alert:main"
meo-live-posts = "meo.tools.live_posts:main"
meo-content-check = "meo.tools.content_check:main"
meo-insights = "meo.tools.insights:main"
meo-post-manual = "meo.tools.post_manual:main"
meo-reply-manual = "meo.tools.reply_manual:main"
meo-offer = "meo.tools.offer:main"
meo-event = "meo.tools.event:main"
meo-delete-post = "meo.tools.delete_post:main"
meo-update-post = "meo.tools.update_post:main"
meo-qa = "meo.tools.qa:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
